[build]
builder = "nixpacks"

# ── Backend Service ────────────────────────────────────────────────────────────
# Set Root Directory = "backend" in Railway dashboard for this service.
# Start command: uvicorn main:app --host 0.0.0.0 --port $PORT

# ── Frontend Service ───────────────────────────────────────────────────────────
# Set Root Directory = "frontend" in Railway dashboard for this service.
# Build command:  npm install && npm run build
# Start command:  npx serve dist -l $PORT
